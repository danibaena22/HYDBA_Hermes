name: HYDBA Build and Publish

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  packages: write

concurrency:
  group: hydba-deploy-develop
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/danibaena22/hydba-hermes

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push HYDBA Hermes
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            HERMES_GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:dev
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max